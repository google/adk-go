name: Require linked issue

# Nudges outside contributors whose PR has neither a linked issue nor a
# description of the change, which CONTRIBUTING.md asks for. Doc and typo
# fixes are exempt, so docs-only PRs are skipped.

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.draft || pr.user.type === 'Bot') return;

            // Maintainers link their own issues. The endpoint 404s for
            // non-collaborators, so the catch is what keeps this from failing
            // on exactly the PRs we want to comment on.
            const { data: perm } = await github.rest.repos
              .getCollaboratorPermissionLevel({ ...context.repo, username: pr.user.login })
              .catch(() => ({ data: { permission: 'none' } }));
            if (['admin', 'maintain', 'write'].includes(perm.permission)) return;

            const body = pr.body ?? '';

            // A closing keyword or a sidebar link, plus any bare "#123" so that
            // the template's "Related: #123" counts too.
            const res = await github.graphql(`
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    closingIssuesReferences(first:1) { totalCount }
                  }
                }
              }`, { owner: context.repo.owner, repo: context.repo.repo, number: pr.number });
            if (res.repository.pullRequest.closingIssuesReferences.totalCount > 0) return;
            if (/(^|[\s(])#\d+\b/.test(body)) return;

            // CONTRIBUTING exempts small documentation and typo fixes.
            const files = await github.paginate(github.rest.pulls.listFiles,
              { ...context.repo, pull_number: pr.number, per_page: 100 });
            const docsOnly = files.length > 0 && files.every(
              f => f.filename.endsWith('.md') || f.filename.startsWith('docs/'));
            if (docsOnly) return;

            // Describing the change in the PR body is the documented
            // alternative to an issue. Subtract the template's own lines so
            // only what the author wrote is counted.
            let template = '';
            try {
              const { data } = await github.rest.repos.getContent({
                ...context.repo, path: '.github/pull_request_template.md', ref: pr.base.sha,
              });
              template = Buffer.from(data.content, 'base64').toString('utf8');
            } catch { /* no template; count the whole body */ }
            const boilerplate = new Set(
              template.split('\n').map(l => l.trim()).filter(Boolean));
            const written = body.split('\n').map(l => l.trim())
              .filter(l => l && !boilerplate.has(l))
              .join(' ').split(/\s+/).filter(Boolean).length;
            if (written >= 25) return;

            const newIssue = new URL(
              `https://github.com/${context.repo.owner}/${context.repo.repo}/issues/new`);
            newIssue.searchParams.set('template', 'bug_report.md');
            newIssue.searchParams.set('title', pr.title);
            newIssue.searchParams.set('body', `Found while preparing #${pr.number}.\n\n`);

            await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number,
              body:
                `Thanks for the PR, @${pr.user.login}.\n\n` +
                'One thing before review. Our [contribution guide]' +
                '(https://github.com/google/adk-go/blob/main/CONTRIBUTING.md#requirement-for-prs) ' +
                'asks for an issue behind each change, or, when no issue exists, a description ' +
                'of the problem and the solution in the PR description. I could not find ' +
                'either here, so whichever suits you:\n\n' +
                `- [Open an issue](${newIssue}) — the link prefills the bug template with your ` +
                'PR title — then add `Closes: #<number>` to the description.\n' +
                '- Or fill in the Problem and Solution sections of the PR template above.\n\n' +
                "Happy to open the issue for you if you'd rather — just say so. " +
                'If this is a small doc or typo fix, ignore me.' });
